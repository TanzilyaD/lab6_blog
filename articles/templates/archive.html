{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Архив статей</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="archive">
    <div class="header">
        <img src="{% static 'img/logo.png' %}" alt="Django public blog">
        {% if user.is_authenticated %}
            <a class="all-posts" href="{% url 'create_post' %}" style="margin-left: 20px;">Добавить статью</a>
            <a class="all-posts" href="{% url 'logout' %}" style="margin-left: 10px;">Выйти ({{ user.username }})</a>
        {% else %}
            <a class="all-posts" href="{% url 'register' %}" style="margin-left: 20px;">Регистрация</a>
            <a class="all-posts" href="{% url 'login' %}" style="margin-left: 10px;">Вход</a>
        {% endif %}
    </div>
    <div class="archive">
        {% for post in posts %}
        <div class="one-post">
            <h2 class="post-title"><a href="{% url 'get_article' post.id %}">{{ post.title }}</a></h2>
            <div class="article-info">
                <div class="article-author">{{ post.author.username }}</div>
                <div class="article-created-date">{{ post.created_date }}</div>
            </div>
            <p class="article-text">{{ post.get_excerpt }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
