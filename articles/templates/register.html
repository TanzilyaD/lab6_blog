{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="form-page">
    <div class="content">
        <div class="header">
            <a class="all-posts" href="{% url 'archive' %}">На главную</a>
            <img src="{% static 'img/logo.png' %}" alt="Django public blog">
        </div>
        <h1>Регистрация</h1>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Логин" value="{{ request.POST.username }}">
            <input type="password" name="password" placeholder="Пароль">
            <input type="submit" value="Зарегистрироваться">
        </form>
        {% if error %}
            <div class="errors">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
