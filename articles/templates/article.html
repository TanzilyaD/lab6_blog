{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="article">
    <div class="content">
        <div class="header">
            <a class="all-posts" href="{% url 'register' %}" style="float: left; margin-right: 20px;">Регистрация</a>
            <a class="all-posts" href="{% url 'login' %}" style="float: left;">Вход</a>
            <a class="all-posts" href="{% url 'archive' %}">Все статьи</a>
            <img src="{% static 'img/logo.png' %}" alt="Django public blog">
        </div>
        <h1 class="post-title">{{ post.title }}</h1>
        <div class="article-info">
            <div class="article-author">{{ post.author.username }}</div>
            <div class="article-created-date">{{ post.created_date }}</div>
        </div>
        <p class="article-text">{{ post.text|linebreaksbr }}</p>
    </div>
</body>
</html>
